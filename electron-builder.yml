appId: dev.houwert.argus
productName: Argus
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules/**/*"
  - node_modules/node-pty/**/*
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/menu-icons
    to: menu-icons
    filter:
      - "**/*.png"
  # Tool assets — bundled into the app. The tool store gates *use* behind
  # the user's enable toggle, but the binaries always ship with Argus.
  # (The conductor tree is copied in via the `afterPack` hook because
  # electron-builder's default matcher strips nested `node_modules` even
  # with explicit filters.)
  - from: native/argus-sim-bridge/argus-sim-bridge
    to: argus-sim-bridge
  - from: native/argus-sim-input/argus-sim-input
    to: argus-sim-input
  - from: native/scrcpy-server/scrcpy-server.jar
    to: scrcpy-server.jar
  - from: native/emulator-proto/emulator_controller.proto
    to: emulator_controller.proto
  - from: packages/host/prompts/worktree-agent-system-prompt.md
    to: worktree-agent-system-prompt.md
  - from: packages/host/prompts/root-agent-system-prompt.md
    to: root-agent-system-prompt.md
  - from: packages/host/prompts/org-host-agent-system-prompt.md
    to: org-host-agent-system-prompt.md
  - from: docs/project-settings.md
    to: docs/project-settings.md
  # LAN web client bundle — served by the gateway in LAN mode. Built by
  # `build:web-client` before packaging; resolved at runtime via
  # process.resourcesPath/argus-web.
  - from: clients/argus-web/dist
    to: argus-web
afterPack: scripts/electron-after-pack.cjs
mac:
  identity: null
  target:
    - target: dir
      arch:
        - arm64
  category: public.app-category.developer-tools
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    NSDesktopFolderUsageDescription: Argus needs access to your Desktop so agents can read and edit files in projects you keep there.
    NSDocumentsFolderUsageDescription: Argus needs access to your Documents so agents can read and edit files in projects you keep there.
    NSDownloadsFolderUsageDescription: Argus needs access to your Downloads so agents can read files you've downloaded into projects.
    NSRemovableVolumesUsageDescription: Argus needs access to removable volumes so agents can read files from external drives.
    NSNetworkVolumesUsageDescription: Argus needs access to network volumes so agents can read files from mounted shares.
    NSAppleEventsUsageDescription: Argus uses Apple Events to control developer tools (simulators, terminals) on your behalf.
    NSCameraUsageDescription: Argus needs camera access to display video from connected capture cards and cameras.
    NSSystemAdministrationUsageDescription: Argus performs system administration tasks to manage simulators, emulators, and developer tooling.
dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
asar: true
