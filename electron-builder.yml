appId: dev.houwert.argus
productName: Argus
directories:
  buildResources: build
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - "!node_modules/**/*"
  - node_modules/node-pty/**/*
extraResources:
  - from: build/icon.png
    to: icon.png
  # argus-hotkey-bridge stays bundled — it's not a plugin (the launcher is core).
  - from: native/argus-hotkey-bridge/argus-hotkey-bridge
    to: argus-hotkey-bridge
    filter:
      - "**/*"
  - from: build/menu-icons
    to: menu-icons
    filter:
      - "**/*.png"
  # NOTE: Plugin assets (argus-sim-bridge, scrcpy-server.jar, conductor tree)
  # are NOT bundled. They're fetched from the GH release for the running app
  # version on first plugin enable — see `electron/services/plugins/assets.ts`.
  - from: electron/prompts/worktree-agent-system-prompt.md
    to: worktree-agent-system-prompt.md
  - from: electron/prompts/root-agent-system-prompt.md
    to: root-agent-system-prompt.md
  - from: electron/prompts/org-host-agent-system-prompt.md
    to: org-host-agent-system-prompt.md
  - from: docs/project-settings.md
    to: docs/project-settings.md
afterPack: scripts/electron-after-pack.cjs
mac:
  identity: null
  target:
    - target: dir
      arch:
        - arm64
  category: public.app-category.developer-tools
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    NSDesktopFolderUsageDescription: Argus needs access to your Desktop so agents can read and edit files in projects you keep there.
    NSDocumentsFolderUsageDescription: Argus needs access to your Documents so agents can read and edit files in projects you keep there.
    NSDownloadsFolderUsageDescription: Argus needs access to your Downloads so agents can read files you've downloaded into projects.
    NSRemovableVolumesUsageDescription: Argus needs access to removable volumes so agents can read files from external drives.
    NSNetworkVolumesUsageDescription: Argus needs access to network volumes so agents can read files from mounted shares.
    NSAppleEventsUsageDescription: Argus uses Apple Events to control developer tools (simulators, terminals) on your behalf.
    NSSystemAdministrationUsageDescription: Argus performs system administration tasks to manage simulators, emulators, and developer tooling.
dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"
asar: true
