name: TestFlight

# Builds the iPhone app (clients/apple, scheme ArgusRemote) and uploads it to
# TestFlight. Version: package.json's without any pre-release suffix; build:
# the commit count, so every upload is newer than the last.

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        # The lane extracts "What to Test" from CHANGELOG.md with a tsx script.
        run: pnpm install --frozen-lockfile

      - name: Install fastlane
        run: bundle install

      - name: Create build keychain
        env:
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s build.keychain

      - name: Encode match git auth
        env:
          MATCH_GIT_PAT: ${{ secrets.MATCH_GIT_PAT }}
        run: |
          AUTH=$(printf '%s' "x-access-token:${MATCH_GIT_PAT}" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$AUTH" >> "$GITHUB_ENV"

      - name: Select Xcode 27.2
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          # Xcode 27 ships without it; SwiftTerm compiles Metal shaders.
          xcodebuild -downloadComponent MetalToolchain

      - name: Let SwiftPM fetch Grove
        # The private DouweBos/Grove package; a token read-only on Grove, for its URL alone.
        env:
          GROVE_TOKEN: ${{ secrets.GROVE_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GROVE_TOKEN}@github.com/DouweBos/Grove.git".insteadOf \
            "https://github.com/DouweBos/Grove.git"
          # No credential helper: git never asks the build keychain to store it.
          git config --global credential.helper ""
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      # Shared with the Mac release: same Package.resolved, same clones.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/spm-clones
          key: spm-${{ hashFiles('clients/apple/**/Package.resolved') }}
          restore-keys: spm-

      - name: Build and upload
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_NAME: build.keychain
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          SPM_CLONE_DIR: /Users/runner/spm-clones
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          CI: "true"
        run: bundle exec fastlane ios testflight
