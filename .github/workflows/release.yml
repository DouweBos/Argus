name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options:
          - stable
          - alpha
          - rc
        default: stable

concurrency:
  # Each channel gets its own concurrency group so an alpha cut doesn't queue
  # behind a stable cut.
  group: release-${{ github.event.inputs.channel || 'stable' }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
    # Stable cuts must come from main; alpha/rc can come from any branch.
    if: ${{ github.event.inputs.channel != 'stable' || github.ref == 'refs/heads/main' }}
    env:
      CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply changesets
        run: |
          if [ "$CHANNEL" = "stable" ]; then
            pnpm changeset version
          else
            # Pre-release versioning: enter pre-release mode, run version, then
            # exit without committing the exit. The source branch's changeset
            # state stays untouched — the bumped version + tag only live in
            # tag-space. CHANGELOG.md may pick up a pre-release header which
            # we restore at the end of this step.
            git checkout CHANGELOG.md || true
            pnpm changeset pre enter "$CHANNEL"
            pnpm changeset version
            pnpm changeset pre exit
            # Don't commit the .changeset/pre.json side files.
            git checkout .changeset/pre.json 2>/dev/null || true
            rm -f .changeset/pre.json
          fi

      - name: Extract release notes
        id: notes
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Pull the top section of CHANGELOG.md (everything between the first
          # '## ' heading and the next one) into release-notes.md.
          awk '
            /^## / { if (found) exit; found=1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Commit and tag release
        id: stage
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$CHANNEL" = "stable" ]; then
            git add -A
            if git diff --staged --quiet; then
              echo "No changesets to release"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git commit -m "chore: release v${VERSION}"
            git tag "v${VERSION}"
            git push origin main
            git push origin "v${VERSION}"
          else
            # Pre-release: only push the tag, not the bumped commit. The
            # source branch's changeset state stays unchanged so the next
            # stable cut picks up the same set of unconsumed changesets.
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Install fastlane
        if: steps.stage.outputs.has_changes == 'true'
        run: bundle install

      - name: Create build keychain
        if: steps.stage.outputs.has_changes == 'true'
        env:
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          security create-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          # Prepend build.keychain to the search list so match can find installed certs
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s build.keychain
          echo "Keychain ready at $KEYCHAIN_PATH"

      - name: Run fastlane release
        if: steps.stage.outputs.has_changes == 'true'
        env:
          # --- Signing (match) ---
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_NAME: build.keychain
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}

          # --- Notarization (App Store Connect API key) ---
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

          # --- GitHub release publisher ---
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

          # --- Telemetry (PostHog) ---
          # Inlined at build time into both bundles: Vite picks up
          # `VITE_POSTHOG_*` for the renderer, and `build-electron.mjs`
          # passes `POSTHOG_*` to esbuild `define` so posthog-node in the
          # main process gets the same secret. Both pairs come from the
          # same GitHub secret. Without these, telemetry stays dormant.
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

          # Forwarded to electron-builder so the GitHub release body reflects
          # the CHANGELOG section for this version.
          ARGUS_RELEASE_NOTES_FILE: ${{ github.workspace }}/release-notes.md

          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          CI: "true"
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          bundle exec fastlane mac release \
            allow_dirty:true \
            allow_any_branch:true \
            channel:${{ env.CHANNEL }}

      - name: Mark release as pre-release
        if: ${{ steps.stage.outputs.has_changes == 'true' && env.CHANNEL != 'stable' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          gh release edit "v${VERSION}" --prerelease

      - name: Update GitHub release body with changelog
        # electron-builder uploads the .dmg / .zip / latest-mac.yml to the
        # GitHub release, but its release body handling is unreliable —
        # often the body ends up empty. Force the body to the extracted
        # CHANGELOG section so the GitHub release page shows the actual
        # user-facing changes.
        if: steps.stage.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          if [ ! -s release-notes.md ]; then
            echo "release-notes.md is empty — skipping body update"
            exit 0
          fi
          gh release edit "v${VERSION}" --notes-file release-notes.md
          echo "Updated GitHub release v${VERSION} body from release-notes.md"

      - name: Notify houwert.dev to sync changelogs
        # Fires a repository_dispatch on DouweBos/houwert.dev so its
        # `Sync changelogs` workflow regenerates src/data/changelogs.generated.json
        # and commits it to main. That commit is what triggers the
        # Cloudflare Pages rebuild — keeps the repo and the deployed site
        # in lockstep. WEBSITE_DISPATCH_TOKEN is a fine-grained PAT with
        # `Actions: Read and write` on DouweBos/houwert.dev. Skipped silently
        # if not configured. Pre-releases skip this — alphas/RCs don't
        # belong in the public changelog.
        if: ${{ steps.stage.outputs.has_changes == 'true' && env.CHANNEL == 'stable' }}
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN not set — skipping website notify"
            exit 0
          fi
          gh api repos/DouweBos/houwert.dev/dispatches \
            --method POST \
            -f event_type=upstream-release \
            -F "client_payload[product]=argus" \
            -F "client_payload[version]=${VERSION}"
          echo "Notified houwert.dev of argus v${VERSION}"
