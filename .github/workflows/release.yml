name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options:
          - production
          - beta
          - alpha
        default: production
      app:
        # `mac` ships Argus for Mac, and on production that is the cutover:
        # its cutover-mac.yml moves every migrated Electron desktop onto it.
        description: "Desktop app"
        type: choice
        options:
          - electron
          - mac
        default: electron

concurrency:
  # Each channel gets its own concurrency group so an alpha cut doesn't queue
  # behind a production cut.
  group: release-${{ github.event.inputs.channel || 'production' }}
  cancel-in-progress: false

jobs:
  release:
    # Argus for Mac builds with Xcode 27 (its SDK is what development uses); the
    # Electron app stays on the macOS 26 image it has always shipped from.
    runs-on: ${{ github.event.inputs.app == 'mac' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    # Production and beta cuts must come from main; alpha can come from any branch.
    if: ${{ github.event.inputs.channel == 'alpha' || github.ref == 'refs/heads/main' }}
    env:
      CHANNEL: ${{ github.event.inputs.channel || 'production' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply changesets
        run: |
          if [ "$CHANNEL" = "production" ]; then
            pnpm changeset version
          else
            # Pre-release versioning: enter pre-release mode, run version, then
            # exit without committing the exit. The source branch's changeset
            # state stays untouched — the bumped version + tag only live in
            # tag-space. CHANGELOG.md may pick up a pre-release header which
            # we restore at the end of this step.
            git checkout CHANGELOG.md || true
            pnpm changeset pre enter "$CHANNEL"
            pnpm changeset version
            pnpm changeset pre exit
            # Don't commit the .changeset/pre.json side files.
            git checkout .changeset/pre.json 2>/dev/null || true
            rm -f .changeset/pre.json

            # changeset always restarts the pre-release counter at 0 because
            # the source branch never carries pre.json forward. Bump the
            # trailing index past any existing v<base>-<channel>.N tag so we
            # don't collide with prior alpha/beta cuts of the same base.
            git fetch --tags --quiet
            BUMPED=$(node -p "require('./package.json').version")
            BASE="${BUMPED%-*}"
            HIGHEST=$(git tag -l "v${BASE}-${CHANNEL}.*" \
              | sed -n "s/^v${BASE}-${CHANNEL}\.\([0-9][0-9]*\)$/\1/p" \
              | sort -n | tail -1)
            if [ -n "$HIGHEST" ]; then
              NEXT=$((HIGHEST + 1))
              NEW_VERSION="${BASE}-${CHANNEL}.${NEXT}"
              echo "Bumping ${BUMPED} → ${NEW_VERSION} (highest existing tag: v${BASE}-${CHANNEL}.${HIGHEST})"
              node -e "const fs=require('fs');const p=require('./package.json');p.version='${NEW_VERSION}';fs.writeFileSync('./package.json',JSON.stringify(p,null,2)+'\n');"
            else
              echo "No existing v${BASE}-${CHANNEL}.* tag — keeping ${BUMPED}"
            fi
          fi

      - name: Extract release notes
        id: notes
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Pull the top section of CHANGELOG.md (everything between the first
          # '## ' heading and the next one) into release-notes.md.
          awk '
            /^## / { if (found) exit; found=1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Commit and tag release
        id: stage
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$CHANNEL" = "production" ]; then
            git add -A
            if git diff --staged --quiet; then
              echo "No changesets to release"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git commit -m "chore: release v${VERSION}"
            git tag "v${VERSION}"
            git push origin main
            git push origin "v${VERSION}"
          else
            # Pre-release: only push the tag, not the bumped commit. The
            # source branch's changeset state stays unchanged so the next
            # production cut picks up the same set of unconsumed changesets.
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Install fastlane
        if: steps.stage.outputs.has_changes == 'true'
        run: bundle install

      - name: Create build keychain
        if: steps.stage.outputs.has_changes == 'true'
        env:
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          security create-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          # Prepend build.keychain to the search list so match can find installed certs
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s build.keychain
          echo "Keychain ready at $KEYCHAIN_PATH"

      - name: Encode match git auth
        if: steps.stage.outputs.has_changes == 'true'
        env:
          MATCH_GIT_PAT: ${{ secrets.MATCH_GIT_PAT }}
        run: |
          # match needs base64("user:token") for the HTTPS Authorization header.
          # Store the raw PAT as a secret and encode it here so rotation is trivial.
          AUTH=$(printf '%s' "x-access-token:${MATCH_GIT_PAT}" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$AUTH" >> "$GITHUB_ENV"

      - name: Select Xcode 27.2
        if: ${{ github.event.inputs.app == 'mac' }}
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          # Xcode 27 ships without it; SwiftTerm compiles Metal shaders.
          xcodebuild -downloadComponent MetalToolchain

      - name: Let SwiftPM fetch Grove
        # Argus for Mac depends on the private DouweBos/Grove package; a fine-grained
        # token (Contents: read on Grove only), used for its URL alone.
        if: ${{ steps.stage.outputs.has_changes == 'true' && github.event.inputs.app == 'mac' }}
        env:
          GROVE_TOKEN: ${{ secrets.GROVE_TOKEN }}
        run: |
          git config --global \
            url."https://x-access-token:${GROVE_TOKEN}@github.com/DouweBos/Grove.git".insteadOf \
            "https://github.com/DouweBos/Grove.git"
          # The token is in the URL: no credential helper, so git never asks the
          # (build) keychain to store it, and never prompts.
          git config --global credential.helper ""
          echo "GIT_TERMINAL_PROMPT=0" >> "$GITHUB_ENV"

      # The tree-sitter grammars' full histories take ~8 minutes to clone cold.
      - name: Cache Swift packages
        if: ${{ steps.stage.outputs.has_changes == 'true' && github.event.inputs.app == 'mac' }}
        uses: actions/cache@v4
        with:
          path: ~/spm-clones
          key: spm-${{ hashFiles('clients/apple/**/Package.resolved') }}
          restore-keys: spm-

      - name: Run fastlane release
        if: steps.stage.outputs.has_changes == 'true'
        env:
          # --- Signing (match) ---
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          # MATCH_GIT_BASIC_AUTHORIZATION is set in $GITHUB_ENV by the
          # "Encode match git auth" step above from the raw MATCH_GIT_PAT secret.
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_NAME: build.keychain
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}

          # --- Notarization (App Store Connect API key) ---
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

          # --- GitHub release publisher ---
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

          # --- Telemetry (PostHog) ---
          # Inlined at build time into both bundles: Vite picks up
          # `VITE_POSTHOG_*` for the renderer, and `build-electron.mjs`
          # passes `POSTHOG_*` to esbuild `define` so posthog-node in the
          # main process gets the same secret. Both pairs come from the
          # same GitHub secret. Without these, telemetry stays dormant.
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
          VITE_POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

          # Forwarded to electron-builder so the GitHub release body reflects
          # the CHANGELOG section for this version.
          ARGUS_RELEASE_NOTES_FILE: ${{ github.workspace }}/release-notes.md

          # --- Sparkle (Argus for Mac only) ---
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          CI: "true"
          NODE_OPTIONS: "--max-old-space-size=8192"
          APP: ${{ github.event.inputs.app || 'electron' }}
          # The cached package clones; only the Mac lane reads it.
          SPM_CLONE_DIR: /Users/runner/spm-clones
        run: |
          lane=release
          [ "$APP" = "mac" ] && lane=mac_app_release
          bundle exec fastlane mac "$lane" \
            allow_dirty:true \
            allow_any_branch:true \
            channel:${{ env.CHANNEL }}

      - name: Mark release as pre-release
        if: ${{ steps.stage.outputs.has_changes == 'true' && env.CHANNEL != 'production' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          gh release edit "v${VERSION}" --prerelease

      - name: Update GitHub release body with changelog
        # electron-builder uploads the .dmg / .zip / latest-mac.yml to the
        # GitHub release, but its release body handling is unreliable —
        # often the body ends up empty. Force the body to the extracted
        # CHANGELOG section so the GitHub release page shows the actual
        # user-facing changes.
        if: steps.stage.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          if [ ! -s release-notes.md ]; then
            echo "release-notes.md is empty — skipping body update"
            exit 0
          fi
          gh release edit "v${VERSION}" --notes-file release-notes.md
          echo "Updated GitHub release v${VERSION} body from release-notes.md"

      - name: Notify houwert.dev to sync changelogs
        # Fires a repository_dispatch on DouweBos/houwert.dev so its
        # `Sync changelogs` workflow regenerates src/data/changelogs.generated.json
        # and commits it to main. That commit is what triggers the
        # Cloudflare Pages rebuild — keeps the repo and the deployed site
        # in lockstep. WEBSITE_DISPATCH_TOKEN is a fine-grained PAT with
        # `Actions: Read and write` on DouweBos/houwert.dev. Skipped silently
        # if not configured. Pre-releases skip this — beta/alpha builds
        # don't belong in the public changelog.
        if: ${{ steps.stage.outputs.has_changes == 'true' && env.CHANNEL == 'production' }}
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          VERSION: ${{ steps.stage.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN not set — skipping website notify"
            exit 0
          fi
          gh api repos/DouweBos/houwert.dev/dispatches \
            --method POST \
            -f event_type=upstream-release \
            -F "client_payload[product]=argus" \
            -F "client_payload[version]=${VERSION}"
          echo "Notified houwert.dev of argus v${VERSION}"
