name: Release

# Ships Argus for Mac (GitHub release + Sparkle feeds) and the iPhone app
# (TestFlight) from one run: both legs build in parallel with the same version
# (package.json after changesets) and build number (run number + 2000).
# Nothing is tagged or published until both have passed.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options:
          - production
          - beta
          - alpha
        default: production

concurrency:
  # Each channel gets its own concurrency group so an alpha cut doesn't queue
  # behind a production cut.
  group: release-${{ github.event.inputs.channel || 'production' }}
  cancel-in-progress: false

env:
  CHANNEL: ${{ github.event.inputs.channel || 'production' }}

jobs:
  build:
    # Both apps build with Xcode 27 (its SDK is what development uses).
    runs-on: xcode-27
    timeout-minutes: 120
    # Production and beta cuts must come from main; alpha can come from any branch.
    if: ${{ github.event.inputs.channel == 'alpha' || github.ref == 'refs/heads/main' }}
    strategy:
      # One failed leg cancels the other: there is no half release.
      fail-fast: true
      matrix:
        platform: [mac, ios]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply changesets
        id: version
        run: scripts/release-version.sh "$CHANNEL"

      - name: Install fastlane
        if: steps.version.outputs.has_changes == 'true'
        run: bundle install

      - name: Create build keychain
        if: steps.version.outputs.has_changes == 'true'
        env:
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$MATCH_KEYCHAIN_PASSWORD" build.keychain
          # Prepend build.keychain to the search list so match can find installed certs
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s build.keychain

      - name: Encode match git auth
        if: steps.version.outputs.has_changes == 'true'
        env:
          MATCH_GIT_PAT: ${{ secrets.MATCH_GIT_PAT }}
        run: |
          # match needs base64("user:token") for the HTTPS Authorization header.
          AUTH=$(printf '%s' "x-access-token:${MATCH_GIT_PAT}" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$AUTH" >> "$GITHUB_ENV"

      - name: Select Xcode 27.2
        if: steps.version.outputs.has_changes == 'true'
        run: |
          sudo xcode-select -s /Applications/Xcode_27.2.app
          xcodebuild -version
          # Xcode 27 ships without it; SwiftTerm compiles Metal shaders.
          xcodebuild -downloadComponent MetalToolchain

      # The tree-sitter grammars' full histories take ~8 minutes to clone cold.
      - name: Cache Swift packages
        if: steps.version.outputs.has_changes == 'true'
        uses: actions/cache@v4
        with:
          path: ~/spm-clones
          key: spm-${{ matrix.platform }}-${{ hashFiles('clients/apple/**/Package.resolved') }}
          restore-keys: |
            spm-${{ matrix.platform }}-
            spm-

      - name: Build
        if: steps.version.outputs.has_changes == 'true'
        env:
          # --- Signing (match); MATCH_GIT_BASIC_AUTHORIZATION comes from the step above ---
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_KEYCHAIN_NAME: build.keychain
          MATCH_KEYCHAIN_PASSWORD: ${{ secrets.MATCH_KEYCHAIN_PASSWORD }}

          # --- Notarization and TestFlight (App Store Connect API key) ---
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

          # --- Telemetry (PostHog) ---
          # Inlined at build time: `build-host.mjs` passes `POSTHOG_*` to
          # esbuild `define` for the bundled host, and the web client's build
          # falls back to the same pair. Without these, telemetry stays dormant.
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}

          # This version's CHANGELOG section: the Sparkle appcast's notes, the
          # cutover feed Electron installs read, and TestFlight's "What to Test".
          ARGUS_RELEASE_NOTES_FILE: ${{ github.workspace }}/release-notes.md

          # --- Sparkle ---
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}

          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          CI: "true"
          NODE_OPTIONS: "--max-old-space-size=8192"
          SPM_CLONE_DIR: /Users/runner/spm-clones
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "$PLATFORM" = "mac" ]; then
            bundle exec fastlane mac mac_app_release \
              allow_dirty:true allow_any_branch:true publish:false channel:"$CHANNEL"
            # The publish job uploads these once both legs have passed.
            mkdir -p release-dist
            while IFS= read -r asset; do [ -n "$asset" ] && cp "$asset" release-dist/; done < release-assets.txt
          else
            bundle exec fastlane ios testflight
          fi

      - name: Keep the Mac release assets
        if: steps.version.outputs.has_changes == 'true' && matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: release-dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      # Publishing needs no Ruby: skip compiling it on Linux.
      - uses: jdx/mise-action@v2
        with:
          install_args: node pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same commit, same tags: the version both build legs shipped.
      - name: Apply changesets
        id: version
        run: scripts/release-version.sh "$CHANNEL"

      - name: Fetch the Mac release assets
        if: steps.version.outputs.has_changes == 'true'
        uses: actions/download-artifact@v4
        with:
          name: mac-release
          path: release-dist

      - name: Tag and push
        if: steps.version.outputs.has_changes == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "$CHANNEL" = "production" ]; then
            git add -A -- . ':!release-notes.md' ':!release-dist'
            git commit -m "chore: release v${VERSION}"
          fi
          # The tag names the commit that was built, even if main moved meanwhile.
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          if [ "$CHANNEL" = "production" ]; then
            # Pre-releases leave main alone, so the next production cut still sees
            # every changeset.
            if ! git push origin HEAD:main; then
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi

      - name: Publish release
        if: steps.version.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          flags=(--verify-tag --title "v${VERSION}")
          [ "$CHANNEL" = "production" ] || flags+=(--prerelease)
          if [ -s release-notes.md ]; then flags+=(--notes-file release-notes.md); else flags+=(--notes ""); fi
          gh release create "v${VERSION}" "${flags[@]}" release-dist/*

      - name: Notify houwert.dev to sync changelogs
        # Fires a repository_dispatch on DouweBos/houwert.dev so its
        # `Sync changelogs` workflow regenerates src/data/changelogs.generated.json
        # and commits it to main. That commit is what triggers the
        # Cloudflare Pages rebuild — keeps the repo and the deployed site
        # in lockstep. WEBSITE_DISPATCH_TOKEN is a fine-grained PAT with
        # `Actions: Read and write` on DouweBos/houwert.dev. Skipped silently
        # if not configured. Pre-releases skip this — beta/alpha builds
        # don't belong in the public changelog.
        if: ${{ steps.version.outputs.has_changes == 'true' && env.CHANNEL == 'production' }}
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "WEBSITE_DISPATCH_TOKEN not set — skipping website notify"
            exit 0
          fi
          gh api repos/DouweBos/houwert.dev/dispatches \
            --method POST \
            -f event_type=upstream-release \
            -F "client_payload[product]=argus" \
            -F "client_payload[version]=${VERSION}"
          echo "Notified houwert.dev of argus v${VERSION}"
